        <h1>The world doesn’t arrive at consensus. You draft it.</h1>
        <p>Bring a position. Test it in public. Leave with language that can hold more than one truth.</p>
        <p><strong>Concept disclosure:</strong> Committee, agenda, and schedule content is illustrative. This is not a live event listing and no UN affiliation is implied.</p>
        <h2>Diplomacy is a writing discipline.</h2>
        <ol><li>Research the position and the interest beneath it.</li><li>Caucus to find shared ground.</li><li>Draft an actor, action, and standard.</li><li>Amend without erasing the coalition.</li><li>Vote and record the remaining disagreement.</li></ol>
